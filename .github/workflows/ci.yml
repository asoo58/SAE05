name: CI Symfony PostgreSQL

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      APP_SECRET: cc98f9da94541703bf5bf4e07a3c3d5a
      DEFAULT_URI: "http://localhost"

    services:
      postgres:
        image:  pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cocagne_test
          POSTGRES_USER: cocagne_user
          POSTGRES_PASSWORD: MdpCocagne
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, intl, zip
          coverage: none

      - name: Mettre en cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Recréer l'environnement à partir de l'exemple
        run: |
          # Si .env.example existe on le copie, sinon on crée un .env minimal
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "APP_ENV=test" > .env
            echo "APP_SECRET=cc98f9da94541703bf5bf4e07a3c3d5a" >> .env
            echo "DEFAULT_URI=http://localhost" >> .env
          fi

          # Surcharge locale spécifique au runner CI pour les tests
          cat << 'EOF' > .env.test.local
          APP_ENV=test
          APP_SECRET=cc98f9da94541703bf5bf4e07a3c3d5a
          DEFAULT_URI=http://localhost
          POSTGRES_HOST=127.0.0.1
          POSTGRES_DB=cocagne_test
          DATABASE_URL="postgresql://cocagne_user:MdpCocagne@127.0.0.1:5432/cocagne_test?serverVersion=16&charset=utf8"
          EOF

      - name: Installer les dépendances
        env:
          APP_ENV: test
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Préparer la base de données
        env:
          APP_ENV: test
        run: |
          php bin/console cache:clear --env=test
          php bin/console doctrine:database:drop --if-exists --force --env=test
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Contrôler la syntaxe (lint)
        env:
          APP_ENV: test
        run: |
          php bin/console lint:yaml config --parse-tags --env=test
          php bin/console lint:twig templates --env=test
          php bin/console lint:container --env=test

      - name: Exécuter les tests
        env:
          APP_ENV: test
        run: php bin/phpunit
